name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Тесты гоняем на CPU-зависимостях (torch CPU и т.д.)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.lock pytest pytest-asyncio

      - name: Run tests
        env:
          # Моки в conftest.py не требуют живого Qdrant,
          # но интеграционные тесты помечаем пропуском через маркер
          RAG_SERVICE_API_KEY: test-api-key
        run: |
          pytest tests/ -v --ignore=tests/test_rest_api_integration.py

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build CPU Docker image
        run: docker build -f Dockerfile.cpu -t rag:ci .
