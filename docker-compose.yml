services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    expose:
      - "6333"
      - "6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__TELEMETRY_DISABLED=true
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
    networks:
      - dds_network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dds-app:latest
    user: "0:0"
    ports:
      - "${SERVICE_PORT:-8000}:${SERVICE_PORT:-8000}"
    environment:
      - QDRANT_URL=http://qdrant:6333
      # Сервис эмбеддингов (text-embeddings-inference) разворачивается отдельно
      # от проекта — см. docs/DEPLOYMENT.md, раздел «Сервис эмбеддингов».
      # По умолчанию — контейнер на этом же хосте (порт 8081).
      - EMBEDDINGS_API_URL=${EMBEDDINGS_API_URL:-http://host.docker.internal:8081}
      - SERVICE_PORT=${SERVICE_PORT:-8000}
      - SERVICE_HOST=0.0.0.0
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
    # host.docker.internal на Linux-хосте требует явного маппинга
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
    networks:
      - dds_network
    restart: unless-stopped
#    deploy:
#      resources:
#        reservations:
#         devices:
#            - driver: nvidia
#              count: 1
#              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${SERVICE_PORT:-8000}/health')"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 180s

networks:
  dds_network:
    driver: bridge
