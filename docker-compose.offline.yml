# =============================================================================
# Автономный compose для офлайн-сервера.
#
# Образы берутся из локального реестра (docker load -i ...), сборка не запускается.
# Код и модели живут внутри образа: bind-mount'ов ./app и ./model_cache здесь нет,
# иначе они перекрыли бы запечённые в образ исходники и bge-m3.
#
# Файл самодостаточный, а не override: Compose при слиянии файлов списки volumes
# складывает, поэтому убрать том из docker-compose.yml через override невозможно.
#
# Запуск:
#   docker compose -f docker-compose.offline.yml up -d
# =============================================================================

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    expose:
      - "6333"
      - "6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__TELEMETRY_DISABLED=true
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
    networks:
      - dds_network
    restart: unless-stopped

  app:
    # Тег должен совпадать с тем, под которым образ сохранён в tar
    image: dds-app:latest
    ports:
      - "${SERVICE_PORT:-8000}:${SERVICE_PORT:-8000}"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - SERVICE_PORT=${SERVICE_PORT:-8000}
      - SERVICE_HOST=0.0.0.0
    env_file:
      - .env
    volumes:
      # Только пользовательские данные; всё остальное — из образа
      - ./uploads:/app/uploads
    depends_on:
      - qdrant
    networks:
      - dds_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${SERVICE_PORT:-8000}/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  dds_network:
    driver: bridge
